PACKAGE_NAME="surface5-camera"
PACKAGE_VERSION="6.19.8.1"
AUTOINSTALL="yes"
# Rebuild only for the Surface kernel, not the machine's stock fallback kernel.
BUILD_EXCLUSIVE_KERNEL="-surface$"
BUILD_EXCLUSIVE_ARCH="x86_64"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/media/i2c modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/media/i2c clean"
BUILT_MODULE_NAME[0]="dw9719"
BUILT_MODULE_NAME[1]="ov8865"
BUILT_MODULE_NAME[2]="ov5693"
for i in 0 1 2; do
    BUILT_MODULE_LOCATION[$i]="drivers/media/i2c"
    DEST_MODULE_LOCATION[$i]="/updates/dkms"
done
